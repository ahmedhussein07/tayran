name: tayran_admin
description: "Tayran admin portal (Flutter Web): admins, categories, subcategories, products."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cupertino_ui: ^1.1.7
  dio: ^5.11.1
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  tayran_ui:
    path: ../packages/tayran_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
