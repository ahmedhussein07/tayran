name: tayran
description: Tayran (طيران) – quick-commerce groceries for villages in Egypt.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  tayran_ui:
    path: ../packages/tayran_ui
  path_provider: ^2.1.6
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/brand/
    - assets/banners/

  # The font, the logo mark and the theme come from packages/tayran_ui.

# Launcher icons: `dart run flutter_launcher_icons` (sources in brand/).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: brand/icon_full.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FA7400"
  adaptive_icon_foreground: brand/icon_foreground.png
  adaptive_icon_foreground_inset: 16

# Native splash: `dart run flutter_native_splash:create` (sources in brand/).
flutter_native_splash:
  color: "#FA7400"
  image: brand/splash_mark.png
  color_dark: "#1C1714"
  image_dark: brand/splash_mark_dark.png
  android_12:
    color: "#FA7400"
    image: brand/splash_mark_android12.png
    color_dark: "#1C1714"
    image_dark: brand/splash_mark_dark_android12.png
  web: false
