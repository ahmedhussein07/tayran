spring.application.name=tayran

server.servlet.context-path=/api/v1
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tayran}
spring.datasource.username=${DB_USERNAME:tayran}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=tayran
# Plain JDBC (the catalog publisher) must find the tables whatever the DB user is called.
spring.datasource.hikari.schema=tayran
spring.jpa.properties.jakarta.persistence.query.timeout=10000

spring.flyway.schemas=tayran
spring.flyway.default-schema=tayran
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# Secrets have no defaults outside the dev profile: set JWT_SECRET and OTP_HASH_SECRET.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=tayran
security.jwt.access-token-ttl=15m
security.jwt.refresh-token-ttl=30d

otp.hash-secret=${OTP_HASH_SECRET}
otp.length=4
otp.ttl=5m
otp.resend-after=30s
otp.max-attempts=5
otp.max-requests-per-window=5
otp.request-window=1h
otp.log-code=false

app.locations-cache-ttl=1h
app.categories-cache-ttl=1h

# Admin portal. The seed admin is read ONLY from these env vars (no defaults anywhere).
admin.seed-phone=${ADMIN_SEED_PHONE:}
admin.seed-password=${ADMIN_SEED_PASSWORD:}
admin.allowed-origins=${ADMIN_ALLOWED_ORIGINS:}
admin.refresh-cookie-secure=${ADMIN_COOKIE_SECURE:true}
admin.max-failed-logins=5
admin.lock-duration=15m
admin.ip-max-attempts=20
admin.ip-window=10m
# Set to "framework" only behind a trusted proxy, so the login IP limit sees the real client IP.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Object storage. CDN_BASE_URL is the public base for reads (images and catalog files).
storage.cdn-base-url=${CDN_BASE_URL}
storage.local-root=${STORAGE_LOCAL_ROOT:.local-cdn}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---- orders and push ----
# Online payment is shown in the app but not processed yet (next phase).
payments.online.enabled=false
# Firebase service account JSON for push. Required outside dev (no default). If the file is
# missing, the backend logs one warning and runs without push. Its contents are never logged.
firebase.service-account-file=${FIREBASE_SERVICE_ACCOUNT_FILE}
