# Local development only. Matches docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tayran}
spring.datasource.password=${DB_PASSWORD:tayran}

# Dev-only secrets. Never reuse these outside your machine.
security.jwt.secret=${JWT_SECRET:dev-only-jwt-signing-secret-for-tayran-local-0123456789}
otp.hash-secret=${OTP_HASH_SECRET:dev-only-otp-hash-secret-for-tayran-local}

# Print the OTP code in the log so you can sign in without SMS.
otp.log-code=true

# Load the sample villages and streets (TEST DATA).
spring.flyway.locations=classpath:db/migration,classpath:db/testdata

logging.level.com.tayran=DEBUG

# Admin portal on `flutter run -d chrome --web-port 5000`.
admin.allowed-origins=${ADMIN_ALLOWED_ORIGINS:http://localhost:5000}
# Local files served at /cdn/** by this backend. Use `adb reverse tcp:8081 tcp:8081` (or your port)
# so the emulator reaches the same localhost URL as the browser.
storage.cdn-base-url=${CDN_BASE_URL:http://localhost:${server.port:8080}/api/v1/cdn}

# Publish the catalog at startup in dev (it is also published every ~90s when dirty).
app.catalog-publish-on-startup=true
